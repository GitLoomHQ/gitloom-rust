name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2

      - run: cargo fmt --check
      - run: cargo clippy --all-features --all-targets -- -D warnings
      - run: cargo build --all-features
      - run: cargo test --all-features

      # The default feature set is what `cargo add gitloom` gives you, and an
      # optional dependency leaking into it only shows up when built without.
      - run: cargo build --no-default-features

      # docs/README.md is what GitBook Git-syncs into this SDK's documentation
      # space. It is a copy, so a README change that skips it silently leaves
      # the published docs describing an older API.
      - name: GitBook copy matches the README
        run: |
          diff -u README.md docs/README.md \
            || { echo "::error::run 'cp README.md docs/README.md' and commit it"; exit 1; }
